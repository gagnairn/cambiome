# Configuration de Pages CMS (https://pagescms.org).
#
# Ce fichier décrit les formulaires que voit l'éditeur du site sur
# app.pagescms.org. Il ne change rien au site lui-même : le site est construit à
# partir de src/content/*.yaml, que ces formulaires écrivent.
#
# Le garde-fou n'est pas ici, il est dans le code : chaque fichier de contenu est
# validé au build par un schéma (src/data/site.ts, src/data/realisations.ts,
# src/data/pages.ts). Une saisie invalide fait échouer la publication et
# le site en ligne garde sa version précédente. Les `required`, `pattern` et
# `maxlength` ci-dessous ne font que signaler l'erreur plus tôt, dans le
# formulaire, plutôt que dix minutes plus tard dans un rapport rouge.
#
# Les intitulés et descriptions sont en français : ce sont eux que lit
# l'éditeur, ils font partie du produit.
#
# Deux pièges de Pages CMS, tous deux vérifiés dans son code source :
#
#   — une liste écrite sous forme d'objet doit comporter `collapsible` : le
#     schéma le rend obligatoire dès qu'on quitte le simple `list: true` ;
#   — `list` posé sur une *entrée* n'est honoré que dans sa forme `list: true`
#     (comparaison stricte, components/entry/entry.tsx). La forme longue y est
#     acceptée par la validation mais ignorée par le formulaire, qui traite
#     alors le tableau comme un objet et l'écrase à l'enregistrement. Les trois
#     fichiers qui portent une liste ont donc une clé de premier niveau
#     — `chantiers`, `metiers`, `piliers` — et la liste est déclarée sur un
#     champ, où toutes les options fonctionnent. `scripts/verifier-cms.mjs`
#     interdit le retour en arrière.

media:
  - name: chantiers
    # `label` n'est pas dans le schéma de Pages CMS, mais la barre latérale le
    # lit (`item.label || item.name`) et la validation laisse passer les clés
    # qu'elle ne connaît pas. Sans lui, le menu afficherait « chantiers » en
    # minuscules, seul intitulé anglo-technique d'une interface française.
    label: Photos de chantiers
    input: src/assets/realisations
    output: src/assets/realisations
    extensions: [jpg, jpeg, png, webp]
    # Les photos arrivent d'un téléphone, avec des noms comme
    # « IMG_2026-08-14 (1).jpg ». On les assainit à l'arrivée : les espaces et
    # les parenthèses compliquent tout par la suite.
    rename: safe

  # Dossier séparé, et pas par goût du rangement : `photos.yml` redimensionne
  # automatiquement tout ce qui arrive dans `realisations/`, et surtout ce
  # dossier-ci ne contient pas d'ouvrages de l'entreprise. Une image d'illustration
  # rangée parmi les chantiers finirait tôt ou tard citée comme réalisation.
  - name: metiers
    label: Images d'illustration des métiers
    input: src/assets/metiers
    output: src/assets/metiers
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  # ------------------------------------------------------------ pages du site
  # Le menu suit la navigation du site — accueil, métiers, démarche,
  # réalisations, contact — et non la liste des fichiers. Une page dont le
  # contenu vient de deux fichiers forme un sous-groupe : l'en-tête d'un côté,
  # le contenu de l'autre, voisins plutôt qu'aux deux bouts du menu.
  #
  # Pages CMS impose un fichier = une entrée. Les rapprocher est tout ce qu'on
  # peut faire : les fondre en un seul formulaire supposerait de fondre les
  # fichiers, or « les quatre métiers » et « les piliers » alimentent aussi la
  # page d'accueil, et le certificat RGE le pied de page.
  #
  # ⚠ Rien d'autre que le libellé n'est lisible dans cette colonne. Une
  # `description` posée sur une entrée ou sur un groupe passe la validation et
  # ne s'affiche NULLE PART : la barre latérale ne rend que `label || name`, et
  # `description` n'est lu que sur un champ (components/entry/entry-form.tsx,
  # vérifié dans le source). Ce que l'éditeur doit lire va donc dans un champ ;
  # la hiérarchie et les libellés font tout le reste.
  #
  # Ce groupe portait une `description` — le rôle de « Titre d'onglet », de
  # « Surtitre » et de « Titre », et la règle des accolades. Elle n'a jamais été
  # affichée à personne. Elle est reprise ci-dessous en commentaire, pour la
  # mémoire du fichier ; ce que l'éditeur en a besoin est dans le guide
  # (« Les mots entre accolades ») et dans la description de chaque champ.
  #
  #   Dans chaque page : « Titre d'onglet » et « Description » sont ce que
  #   lisent l'onglet du navigateur et les résultats de recherche ; « Surtitre »
  #   et « Titre » forment l'en-tête affiché en haut de la page. Les mots entre
  #   accolades — {nom}, {zone}, {lienCnil}… — sont remplacés à la publication
  #   par une valeur du site ou par un lien.
  #
  # Les noms d'entrée sont préfixés « page- » parce que trois pages portent le
  # nom d'une entrée de données — métiers, réalisations, démarche — et qu'un
  # doublon rendrait l'une des deux inatteignable.
  - name: pages
    label: Pages du site
    type: group
    items:
      - name: page-accueil
        label: Accueil
        type: file
        path: src/content/pages/accueil.yaml
        format: yaml
        description: >-
          Pas de titre d'onglet ni de description ici : l'accueil porte ceux du
          site entier, dans « L'entreprise ».
        fields:
          - name: hero
            label: Bandeau d'ouverture
            type: object
            fields:
              - name: titre
                label: Titre
                type: text
                required: true
              - name: texte
                label: Texte
                type: text
                required: true
              - name: boutonMetiers
                label: Bouton vers les métiers
                type: string
                required: true
              - name: boutonContact
                label: Bouton vers le contact
                type: string
                required: true
          - name: metiers
            label: Section « métiers »
            type: object
            fields:
              - name: surtitre
                label: Surtitre
                type: string
                required: true
              - name: titre
                label: Titre
                type: string
                required: true
              - name: texte
                label: Texte
                type: text
                required: true
          - name: demarche
            label: Section « démarche »
            type: object
            fields:
              - name: surtitre
                label: Surtitre
                type: string
                required: true
              - name: titre
                label: Titre
                type: string
                required: true
              - name: texte
                label: Texte
                type: text
                required: true
              - name: bouton
                label: Libellé du bouton
                type: string
                required: true
          - name: realisations
            label: Section « chantiers »
            type: object
            description: >-
              Cette section n'a pas de texte : les trois premiers chantiers
              parlent d'eux-mêmes.
            fields:
              - name: surtitre
                label: Surtitre
                type: string
                required: true
              - name: titre
                label: Titre
                type: string
                required: true
              - name: bouton
                label: Libellé du bouton
                type: string
                required: true

      # --------------------------------------------------------------- metiers
      # Deux fichiers pour une page, et c'est voulu : l'en-tête habille la seule
      # page Métiers ; les métiers eux-mêmes servent aussi aux cartes de la page
      # d'accueil et au sommaire du pied de page. La phrase qui le dit est portée
      # par un champ du formulaire — seul endroit où une description s'affiche.
      - name: groupe-metiers
        label: Métiers
        type: group
        items:
          - name: page-metiers
            label: En-tête de la page
            type: file
            path: src/content/pages/metiers.yaml
            format: yaml
            fields:
              - name: titreOnglet
                label: Titre d'onglet
                type: string
                required: true
              - name: description
                label: Description
                type: text
                required: true
                options:
                  maxlength: 320
              - name: surtitre
                label: Surtitre
                type: string
                required: true
              - name: titre
                label: Titre
                type: string
                required: true
              - name: texte
                label: Texte d'introduction
                type: text
                required: true
              - name: sommaire
                label: Nom du sommaire
                type: string
                required: true
                description: >-
                  N'apparaît pas à l'écran : c'est le nom que les lecteurs d'écran
                  annoncent devant la liste des métiers.

          - name: metiers
            label: Les quatre métiers
            type: file
            path: src/content/metiers.yaml
            format: yaml
            fields:
              - name: metiers
                label: false
                type: object
                description: >-
                  Ces textes sont affichés sur la page Métiers, en cartes sur la page
                  d'accueil et dans le sommaire du pied de page. L'en-tête de la page
                  Métiers, lui, se modifie dans « Textes des pages » → « Nos métiers ».
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: '{fields.titre}'
                fields:
                  - name: slug
                    label: Identifiant
                    type: string
                    required: true
                    pattern:
                      regex: '^[a-z0-9]+(-[a-z0-9]+)*$'
                      message: Minuscules sans accent, chiffres et tirets uniquement.
                    description: >-
                      ⚠ Adresse interne du métier. Elle apparaît dans les liens du pied de
                      page et rattache les chantiers à ce métier. Ne la modifiez pas sur un
                      métier existant : les liens tomberaient en panne et les photos s'en
                      détacheraient.
                  - name: titre
                    label: Titre
                    type: string
                    required: true
                    description: Affiché sur la page Métiers, la page d'accueil et le pied de page.
                    options:
                      maxlength: 48
                  - name: chapo
                    label: Phrase d'introduction
                    type: text
                    required: true
                    description: Une phrase, affichée en gros caractères sous le titre.
                    options:
                      maxlength: 160
                  - name: texte
                    label: Paragraphes
                    type: text
                    required: true
                    list:
                      min: 1
                      collapsible: false
                    description: Un paragraphe par entrée. Pas de mise en forme ni de lien.
                  - name: points
                    label: Liste à puces
                    type: string
                    list: true
                    description: Les prestations, une par entrée. Peut rester vide.
                  - name: illustration
                    label: Image de repli
                    type: object
                    description: >-
                      À ne remplir que pour un métier dont aucun chantier n'a encore
                      été publié — aujourd'hui l'architecture. Elle illustre le métier,
                      elle ne prétend pas montrer un de vos ouvrages, et c'est pourquoi
                      elle est rangée ici et non dans « Chantiers ». Dès qu'un chantier
                      de ce métier est ajouté, sa photo prend la place
                      automatiquement : il n'y a rien à vider ici.
                    fields:
                      - name: fichier
                        label: Image
                        type: image
                        required: true
                        options:
                          media: metiers
                      - name: alt
                        label: Description de l'image
                        type: text
                        required: true
                        description: >-
                          Ce qu'on voit, pour les personnes aveugles et pour Google.
                          Décrivez la scène sans laisser croire qu'il s'agit d'un
                          chantier de l'entreprise.

      # --------------------------------------------------------------- demarche
      # Même partage que pour les métiers : l'en-tête d'un côté, les piliers de
      # l'autre, ces derniers étant repris en liste numérotée sur l'accueil.
      - name: groupe-demarche
        label: Notre démarche
        type: group
        items:
          - name: page-demarche
            label: En-tête de la page
            type: file
            path: src/content/pages/demarche.yaml
            format: yaml
            fields:
              - name: titreOnglet
                label: Titre d'onglet
                type: string
                required: true
              - name: description
                label: Description
                type: text
                required: true
                options:
                  maxlength: 320
              - name: surtitre
                label: Surtitre
                type: string
                required: true
              - name: titre
                label: Titre
                type: string
                required: true
              - name: texte
                label: Texte d'introduction
                type: text
                required: true
              - name: collaboration
                label: Section « travailler ensemble »
                type: object
                fields:
                  - name: surtitre
                    label: Surtitre
                    type: string
                    required: true
                  - name: titre
                    label: Titre
                    type: string
                    required: true
                  - name: texte
                    label: Paragraphes
                    type: text
                    required: true
                    list:
                      min: 1
                      collapsible: false

          - name: demarche
            label: Les piliers
            type: file
            path: src/content/demarche.yaml
            format: yaml
            fields:
              - name: piliers
                label: false
                type: object
                description: >-
                  Ces textes sont affichés sur la page Démarche et repris sur la page
                  d'accueil. L'en-tête de la page Démarche, lui, se modifie dans
                  « Textes des pages » → « Notre démarche ».
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: '{fields.titre}'
                fields:
                  - name: titre
                    label: Titre du pilier
                    type: string
                    required: true
                  - name: texte
                    label: Texte
                    type: text
                    required: true

      # ---------------------------------------------------------- réalisations
      # « Chantiers » était en tête du menu, hors de ce groupe : c'est le geste
      # le plus fréquent, et celui pour lequel le CMS a été mis en place. Il est
      # redescendu ici pour que la règle du menu n'ait aucune exception — une
      # page, un dossier, tout ce qu'il lui faut dedans. La galerie se déplie
      # donc en un clic de plus, ce qui a été pesé et accepté.
      - name: groupe-realisations
        label: Réalisations
        type: group
        items:
          - name: page-realisations
            label: En-tête de la page
            type: file
            path: src/content/pages/realisations.yaml
            format: yaml
            fields:
              - name: titreOnglet
                label: Titre d'onglet
                type: string
                required: true
              - name: description
                label: Description
                type: text
                required: true
                options:
                  maxlength: 320
              - name: surtitre
                label: Surtitre
                type: string
                required: true
              - name: titre
                label: Titre
                type: string
                required: true
              - name: texte
                label: Texte d'introduction
                type: text
                required: true

          - name: realisations
            label: Chantiers
            type: file
            path: src/content/realisations.yaml
            format: yaml
            fields:
              - name: chantiers
                label: false
                type: object
                list:
                  # L'ordre de la liste est l'ordre du site : la page d'accueil montre les
                  # trois premiers chantiers, et la page Métiers illustre chaque métier avec
                  # le premier de sa catégorie. Faire glisser un chantier vers le haut, c'est
                  # le mettre en avant.
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: '{fields.titre}'
                fields:
                  - name: titre
                    label: Titre
                    type: string
                    required: true
                    description: Le nom du chantier, affiché sur la photo.
                    options:
                      maxlength: 60
                  - name: metier
                    label: Étiquette
                    type: string
                    required: true
                    description: >-
                      Le mot affiché dans le coin de la vignette : « Charpente »,
                      « Zinguerie »… Il est libre et peut être plus précis que le métier
                      ci-dessous.
                  - name: metierSlug
                    label: Métier
                    type: select
                    required: true
                    description: >-
                      Détermine sur quelle page Métiers la photo apparaît. La première photo
                      de chaque métier sert à l'illustrer.
                    options:
                      # Recopié de src/content/metiers.yaml. Ajouter un métier là-bas suppose
                      # d'ajouter sa valeur ici, sinon il ne sera pas proposé. Le build
                      # refuse un rattachement à un métier inexistant : la désynchronisation
                      # ne peut pas passer inaperçue.
                      values:
                        - name: charpente-ossature-bois
                          label: Charpente et ossature bois
                        - name: renovation-thermique
                          label: Rénovation thermique
                        - name: couverture-zinguerie
                          label: Couverture et zinguerie
                        - name: structure-bois-menuiserie
                          label: Structure bois et menuiserie
                        - name: architecture
                          label: Architecture
                  - name: legende
                    label: Légende
                    type: text
                    required: true
                    description: >-
                      Une à trois phrases sur le chantier, lues par vos visiteurs. C'est
                      l'endroit pour dire la contrainte du chantier et comment elle a été
                      résolue.
                  - name: alt
                    label: Description de la photo
                    type: text
                    required: true
                    description: >-
                      Ce qu'on voit sur la photo, pour les personnes aveugles et pour Google.
                      Décrivez l'image, ne répétez pas la légende : « Charpente neuve en bois
                      clair vue depuis le faîtage, toits de tuiles en arrière-plan ».
                  - name: image
                    label: Photo
                    type: image
                    required: true
                    description: >-
                      Téléversez la photo telle qu'elle sort de l'appareil : elle est allégée
                      automatiquement après publication. Cadrez serré sur l'ouvrage, en
                      paysage de préférence.
                    options:
                      media: chantiers

      - name: page-contact
        label: Contact
        type: file
        path: src/content/pages/contact.yaml
        format: yaml
        fields:
          - name: titreOnglet
            label: Titre d'onglet
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
            description: '{zone} : la zone d''intervention, reprise de « L''entreprise ».'
            options:
              maxlength: 320
          - name: surtitre
            label: Surtitre
            type: string
            required: true
          - name: titre
            label: Titre
            type: string
            required: true
          - name: texte
            label: Texte d'introduction
            type: text
            required: true

      # --------------------------------------------------------------- rge
      # Les textes de la page d'un côté, le certificat de l'autre — ce dernier
      # alimente aussi le bandeau du pied de page et les mentions légales.
      - name: groupe-rge
        label: Entreprise RGE Qualibat
        type: group
        items:
          - name: page-rge
            label: Textes de la page
            type: file
            path: src/content/pages/rge-qualibat.yaml
            format: yaml
            description: >-
              Le numéro de certificat, les dates et les domaines qualifiés se
              modifient dans « Qualification RGE ». Ici, seulement ce qui les
              entoure.
            fields:
              - name: titreOnglet
                label: Titre d'onglet
                type: string
                required: true
              - name: description
                label: Description
                type: text
                required: true
                description: '{nom} : le nom de l''entreprise.'
                options:
                  maxlength: 320
              - name: surtitre
                label: Surtitre
                type: string
                required: true
              - name: titre
                label: Titre
                type: string
                required: true
              - name: intro
                label: Introduction
                type: text
                required: true
                description: '{nom} et {organisme}.'
              - name: titreAides
                label: Titre « les aides »
                type: string
                required: true
              - name: aides
                label: Les aides
                type: object
                list:
                  min: 1
                  collapsible:
                    collapsed: true
                    summary: '{fields.titre}'
                fields:
                  - name: titre
                    label: Nom de l'aide
                    type: string
                    required: true
                  - name: texte
                    label: Texte
                    type: text
                    required: true
                    description: >-
                      ⚠ N'annoncez aucun montant ni aucun taux : les barèmes changent
                      chaque année et une page qui les affiche devient fausse sans
                      prévenir.
              - name: noteAides
                label: Note sous les aides
                type: text
                required: true
              - name: titreDomaines
                label: Titre « domaines qualifiés »
                type: string
                required: true
              - name: noteDomaines
                label: Note sous les domaines
                type: text
                required: true
                description: >-
                  ⚠ Dit ce que la qualification ne couvre pas. Mieux vaut le lire ici
                  que le découvrir au moment du dossier d'aide.
              - name: titreAttestation
                label: Titre « l'attestation »
                type: string
                required: true
              - name: libelleLienAttestation
                label: Libellé du lien vers l'attestation
                type: string
                required: true
              - name: texteAttestation
                label: Texte autour du lien
                type: text
                required: true
                description: '{lienAttestation} marque l''endroit du lien.'

          - name: rge
            label: Le certificat
            type: file
            path: src/content/rge.yaml
            format: yaml
            fields:
              - name: organisme
                label: Organisme
                type: string
                required: true
              - name: certificat
                label: Numéro de certificat
                type: string
                required: true
              - name: attestation
                label: Lien vers l'attestation (PDF)
                type: string
                required: true
                pattern:
                  regex: '^https://'
                  message: L'adresse doit commencer par https://
              - name: debut
                label: Début de validité
                type: date
                required: true
                options:
                  format: yyyy-MM-dd
              - name: fin
                label: Fin de validité
                type: date
                required: true
                description: >-
                  ⚠ Cette date ne déclenche rien. Le site l'affiche aux mentions légales
                  et la transmet aux moteurs de recherche, mais il continue d'annoncer
                  la qualification une fois la date passée — c'est un choix, revenu sur
                  un retrait automatique qui faisait disparaître la page pendant les
                  renouvellements. Tenez-la donc à jour à chaque renouvellement : c'est
                  désormais la seule chose qui dise jusqu'à quand la qualification vaut.
                  Et si elle n'était pas renouvelée, prévenez-nous pour retirer la
                  mention — afficher un RGE échu est une allégation trompeuse, et rien
                  dans le site ne l'empêche plus.
                options:
                  format: yyyy-MM-dd
              - name: domaines
                label: Domaines qualifiés
                type: string
                required: true
                list:
                  min: 1
                  collapsible: false
                description: >-
                  ⚠ À recopier du registre public de l'ADEME, à l'identique. Annoncer un
                  domaine non couvert est une allégation trompeuse au sens du code de la
                  consommation.

      - name: textes-communs
        label: Blocs répétés sur plusieurs pages
        type: file
        path: src/content/pages/commun.yaml
        format: yaml
        description: >-
          Ces deux blocs reviennent sur plusieurs pages : les modifier ici les
          modifie partout.
        fields:
          - name: appelContact
            label: Encadré « un projet en tête ? »
            type: object
            description: Au pied de l'accueil, des métiers, des chantiers et de la démarche.
            fields:
              - name: titre
                label: Titre
                type: string
                required: true
              - name: texte
                label: Texte
                type: text
                required: true
              - name: bouton
                label: Libellé du bouton
                type: string
                required: true
          - name: renvoiRge
            label: Renvoi vers la qualification RGE
            type: object
            description: >-
              Sous le métier « Rénovation thermique », et seulement lui : le RGE
              n'ouvre aucun droit sur la charpente ou la zinguerie.
            fields:
              - name: surtitre
                label: Surtitre
                type: string
                required: true
                description: '{organisme} : l''organisme qualificateur.'
              - name: texte
                label: Texte
                type: text
                required: true
              - name: lien
                label: Libellé du lien
                type: string
                required: true

  # --------------------------------------------------------------- entreprise
  - name: entreprise
    label: L'entreprise
    type: file
    path: src/content/entreprise.yaml
    format: yaml
    fields:
      - name: identite
        label: Identité
        type: object
        fields:
          - name: nom
            label: Nom
            type: string
            required: true
          - name: baseline
            label: Baseline
            type: string
            required: true
            description: Affichée sous le nom dans l'en-tête.
          - name: accroche
            label: Accroche
            type: string
            required: true
          - name: description
            label: Description du site
            type: text
            required: true
            description: >-
              Le résumé que Google affiche sous le lien du site. Au-delà
              d'environ 160 signes, il est coupé.
            options:
              maxlength: 320
          - name: zone
            label: Zone d'intervention
            type: string
            required: true

      - name: coordonnees
        label: Coordonnées
        type: object
        description: >-
          Ces coordonnées apparaissent au pied de page, sur la page Contact et
          dans les mentions légales à la fois : il n'y a qu'un endroit à
          corriger. Un champ laissé vide fait disparaître la ligne du site,
          plutôt que d'afficher un blanc — mieux vaut ne rien annoncer qu'un
          numéro qui ne répond plus. Seule exception, l'adresse : celle d'ici
          est le siège social, et ne sert qu'aux mentions légales. Celle que
          voient vos visiteurs est dans le bloc « Atelier », plus bas.
        fields:
          - name: email
            label: E-mail
            type: string
          - name: telephone
            label: Téléphone
            type: string
          - name: adresse
            label: Siège social
            description: >-
              L'adresse immatriculée au RCS. Elle paraît dans les mentions
              légales, où la loi l'exige, et sur la page Contact sous
              l'intitulé « Courrier » — c'est là qu'aboutit un recommandé. Ne
              pas y mettre l'atelier : le siège est une donnée juridique, il ne
              se corrige pas ici mais au greffe.
            type: string
          - name: instagram
            label: Lien Instagram
            type: string
          - name: ficheGoogle
            label: Fiche Google
            type: string
            description: >-
              Le lien vers l'établissement dans Google Maps. Pour l'obtenir :
              ouvrir la fiche, bouton « Partager », « Copier le lien ». Il
              ajoute un bouton « Itinéraire » sur la page Contact, et surtout
              il dit à Google que la fiche et le site sont bien la même
              entreprise — ce qui compte pour apparaître dans les résultats
              locaux. Laissé vide tant que la fiche n'existe pas : le bouton ne
              s'affiche alors pas.

      - name: atelier
        label: Atelier
        type: object
        description: >-
          L'établissement où l'on travaille, celui qui a une porte — à ne pas
          confondre avec le siège social ci-dessus. C'est cette adresse qui
          s'affiche au pied de page et sur la page Contact, et c'est elle
          qu'annonce le balisage lu par Google.
        fields:
          - name: adresse
            label: Adresse de l'atelier
            type: string
            description: >-
              Doit être identique, au signe près, à celle de la fiche Google
              Business Profile : c'est sur cette concordance que le moteur
              rapproche la fiche du site. Laissée vide, c'est le siège social
              qui s'affiche partout.
          - name: latitude
            label: Latitude
            type: number
            description: >-
              Situe la porte au mètre près. Pour l'obtenir : clic droit sur le
              point exact dans Google Maps, les deux nombres proposés en haut du
              menu sont la latitude puis la longitude. Laisser 0 si l'on ne
              sait pas — un 0 est traité comme absent.
          - name: longitude
            label: Longitude
            type: number
            description: Voir Latitude ci-dessus. Laisser 0 si l'on ne sait pas.
          - name: horaires
            label: Horaires d'ouverture
            type: object
            list:
              # Sans `summary`, les lignes repliées s'intitulent « Item #1 »,
              # « Item #2 » : pour choisir laquelle corriger, il faut les
              # déplier une à une. Le gabarit affiche la plage elle-même.
              # `{fields.jours}` rend la valeur brute — « lundi-vendredi », pas
              # « Lundi – vendredi » : Pages CMS interpole le contenu du champ,
              # pas l'intitulé de l'option choisie.
              collapsible:
                summary: '{fields.jours} : {fields.ouverture} – {fields.fermeture}'
            description: >-
              ⚠ Ce champ ne fait pas qu'afficher une ligne. Tant qu'il est
              vide, le site dit aux moteurs de recherche « nous intervenons
              dans cette zone ». Dès qu'une plage y figure, il dit « venez
              ici » : Google peut alors proposer un itinéraire vers l'atelier
              et afficher ces horaires. Ne les renseigner que si quelqu'un
              ouvre effectivement la porte à ces heures-là — un client devant
              une porte fermée coûte plus cher que le gain de référencement.
              Une ligne par plage : « lundi – vendredi 8 h – 12 h » et
              « lundi – vendredi 14 h – 18 h » font deux lignes.
            fields:
              - name: jours
                label: Jours
                type: select
                required: true
                options:
                  # Recopié de PLAGES dans src/lib/horaires.ts. Les deux listes
                  # sont comparées par `npm run verifier` : en ajouter une ici
                  # sans l'ajouter là-bas fait échouer le build.
                  values:
                    - name: lundi-vendredi
                      label: Lundi – vendredi
                    - name: lundi-jeudi
                      label: Lundi – jeudi
                    - name: lundi-samedi
                      label: Lundi – samedi
                    - name: samedi-dimanche
                      label: Samedi – dimanche
                    - name: lundi
                      label: Lundi
                    - name: mardi
                      label: Mardi
                    - name: mercredi
                      label: Mercredi
                    - name: jeudi
                      label: Jeudi
                    - name: vendredi
                      label: Vendredi
                    - name: samedi
                      label: Samedi
                    - name: dimanche
                      label: Dimanche
              - name: ouverture
                label: Ouverture
                type: string
                required: true
                description: Sur 24 heures, deux chiffres et deux points — 08:00, 14:30.
              - name: fermeture
                label: Fermeture
                type: string
                required: true
                description: Même forme — 12:00, 18:00.

      # Retiré du formulaire, pas du fichier : `hidden` ne masque que
      # l'affichage. Pages CMS charge la valeur dans l'état du formulaire comme
      # les autres (`initializeState`) et la réécrit telle quelle ; seul le
      # rendu est sauté. La clé ne risque donc pas de se perdre à
      # l'enregistrement — c'est précisément ce qu'on évite ici : vidée par
      # mégarde, elle fait disparaître le formulaire de la page Contact sans
      # que rien ne le signale, ni au build ni en ligne.
      #
      # `hidden` est posé sur l'objet et non sur son unique champ : sur le
      # champ, il resterait une section « Formulaire de contact » vide.
      #
      # Pour changer la clé — obtenue gratuitement sur web3forms.com en y
      # saisissant l'adresse qui recevra les messages —, il faut donc passer
      # par GitHub. C'est un geste unique, fait une fois pour toutes ; elle est
      # publique par conception, il n'y a rien à cacher.
      - name: formulaire
        label: Formulaire de contact
        type: object
        hidden: true
        fields:
          - name: web3formsCle
            label: Clé Web3Forms
            type: string

      - name: identiteLegale
        label: Identité légale
        type: object
        description: >-
          ⚠ Contenu imposé par la loi (art. 6-III de la LCEN). Ces mentions
          doivent figurer sur le site et être exactes ; les vider ou les
          approximer expose l'entreprise. À ne corriger qu'à partir d'un document
          officiel — extrait Kbis, statuts.
        fields:
          - name: siret
            label: SIRET
            type: string
            required: true
          - name: formeJuridique
            label: Forme juridique (abrégée)
            type: string
            required: true
            description: Telle qu'elle apparaît en pied de page. Ex. « SAS ».
          - name: formeJuridiqueLongue
            label: Forme juridique (en toutes lettres)
            type: string
            required: true
            description: >-
              Reprise des statuts, art. 1er. Ex. « société par actions simplifiée
              à associé unique ».
          - name: capital
            label: Capital social
            type: string
            required: true
            description: Celui inscrit aux statuts, mention imposée par leur art. 2.
          - name: rcs
            label: Immatriculation au RCS
            type: string
            required: true
          - name: tva
            label: TVA intracommunautaire
            type: string
            required: true
          - name: directeurPublication
            label: Directeur de la publication
            type: string
            required: true
            description: Le représentant légal — pour une SASU, le président.

      - name: assurance
        label: Assurance professionnelle
        type: object
        description: >-
          ⚠ La garantie décennale est obligatoire (art. L241-1 du code des
          assurances) et l'art. L243-2 impose d'en afficher les coordonnées :
          assureur, contrat, couverture géographique. À reprendre de
          l'attestation d'assurance, sans rien inventer.
        fields:
          - name: souscrite
            label: Contrat en cours
            type: boolean
            required: true
          - name: assureur
            label: Assureur
            type: string
            required: true
          - name: contrat
            label: Numéro de contrat
            type: string
            required: true
          - name: adresse
            label: Adresse de l'assureur
            type: string
            description: >-
              Le siège social — pas l'adresse de résiliation du contrat, qui n'a
              rien à faire dans des mentions légales. Peut rester vide : la page
              n'affiche alors que le nom, ce qui reste exact.
          - name: couverture
            label: Couverture géographique
            type: string
            required: true

      - name: hebergeur
        label: Hébergeur du site
        type: object
        description: >-
          ⚠ Nom, adresse et téléphone exigés par l'art. 6-III de la LCEN. La
          mention doit désigner l'hébergeur réel du moment : elle sert à savoir
          qui détient les fichiers en cas de litige. Ne la modifiez que si
          l'hébergement change — auquel cas prévenez-nous, c'est une bascule
          technique.
        fields:
          - name: nom
            label: Nom
            type: string
            required: true
          - name: adresse
            label: Adresse
            type: string
            required: true
          - name: telephone
            label: Téléphone
            type: string
            required: true

  # -------------------------------------------------------- textes de service
  # Les trois textes qu'on n'ouvre presque jamais : les obligations légales, la
  # page de confirmation d'envoi, la page d'erreur. Groupés hors de la liste des
  # pages pour ne pas la charger de ce qui ne se modifie qu'une fois.
  #
  # Les « blocs répétés » n'y sont PAS, bien qu'ils en aient d'abord eu l'air :
  # `commun.yaml` porte l'encadré de contact du bas de page et le renvoi RGE de
  # la page Métiers — du contenu que le visiteur voit partout, pas un texte de
  # service. Il est resté dans « Pages du site », en dernier.
  - name: service
    label: Textes de service
    type: group
    items:
      - name: page-mentions
        label: Mentions légales
        type: file
        path: src/content/pages/mentions-legales.yaml
        format: yaml
        description: >-
          ⚠ Page à contenu imposé (art. 6-III de la LCEN, art. L243-2 du code des
          assurances, RGPD). Les valeurs — SIRET, assureur, hébergeur — se
          modifient dans « L'entreprise » ; ce sont les phrases qui les portent
          qui se modifient ici. Elles disent le droit : les raccourcir, c'est
          retirer une mention obligatoire.
        fields:
          - name: titreOnglet
            label: Titre d'onglet
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
            description: '{nom} : le nom de l''entreprise.'
            options:
              maxlength: 320
          - name: surtitre
            label: Surtitre
            type: string
            required: true
          - name: titre
            label: Titre
            type: string
            required: true
          - name: titreEditeur
            label: Titre « éditeur du site »
            type: string
            required: true
          - name: titreQualification
            label: Titre « qualification professionnelle »
            type: string
            required: true
          - name: qualification
            label: Texte de la qualification
            type: text
            required: true
            description: '{certificat}, {organisme}, {date} et {domaines}.'
          - name: titreAssurance
            label: Titre « assurance professionnelle »
            type: string
            required: true
            description: >-
              Le texte de cette section est composé à partir de « L'entreprise »
              seule : il n'affiche l'adresse de l'assureur que si elle est
              renseignée, ce qu'un texte à trous ne saurait pas faire.
          - name: titreHebergement
            label: Titre « hébergement »
            type: string
            required: true
          - name: titrePropriete
            label: Titre « propriété intellectuelle »
            type: string
            required: true
          - name: propriete
            label: Texte de la propriété intellectuelle
            type: text
            required: true
            description: '{nom} : le nom de l''entreprise.'
          - name: titreDonnees
            label: Titre « données personnelles »
            type: string
            required: true
          - name: donnees
            label: Texte sur les données
            type: text
            required: true
            description: >-
              ⚠ Finalité, base légale et durée de conservation sont exigées par
              les art. 13 et 14 du RGPD. La durée annoncée — trois ans — doit
              être celle qui est réellement appliquée.
          - name: droits
            label: Texte sur les droits
            type: text
            required: true
            description: >-
              ⚠ L'énumération des droits est celle du RGPD ; le droit de saisir
              la CNIL doit y figurer. {contact} devient l'adresse e-mail, ou le
              téléphone à défaut ; {lienCnil} marque l'endroit du lien.
          - name: libelleLienCnil
            label: Libellé du lien vers la CNIL
            type: string
            required: true
          - name: web3forms
            label: Texte sur Web3Forms
            type: text
            required: true
            description: >-
              ⚠ Ne s'affiche que si le formulaire de contact est activé. Il
              signale un transfert hors Union européenne, information exigée par
              l'art. 13 du RGPD.
          - name: titreCookies
            label: Titre « cookies »
            type: string
            required: true
          - name: cookies
            label: Texte sur les cookies
            type: text
            required: true
            description: >-
              ⚠ Le site ne dépose aucun cookie et n'appelle aucun service tiers.
              Cette phrase doit rester vraie : si un outil de mesure d'audience
              était ajouté, il faudrait la réécrire et poser un bandeau de
              consentement.

      - name: page-merci
        label: Merci (après envoi du formulaire)
        type: file
        path: src/content/pages/merci.yaml
        format: yaml
        description: >-
          Page d'arrivée après l'envoi du formulaire sans JavaScript. Avec
          JavaScript, la confirmation s'affiche sur la page Contact et celle-ci
          n'est jamais vue.
        fields:
          - name: titreOnglet
            label: Titre d'onglet
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
            options:
              maxlength: 320
          - name: surtitre
            label: Surtitre
            type: string
            required: true
          - name: titre
            label: Titre
            type: string
            required: true
          - name: texte
            label: Texte
            type: text
            required: true
          - name: urgence
            label: Phrase sur le téléphone
            type: text
            required: true
            description: >-
              Ajoutée à la suite du texte, et seulement si un numéro de
              téléphone est renseigné.
          - name: bouton
            label: Libellé du bouton
            type: string
            required: true

      - name: page-404
        label: Page introuvable
        type: file
        path: src/content/pages/404.yaml
        format: yaml
        fields:
          - name: titreOnglet
            label: Titre d'onglet
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
            options:
              maxlength: 320
          - name: surtitre
            label: Surtitre
            type: string
            required: true
          - name: titre
            label: Titre
            type: string
            required: true
          - name: texte
            label: Texte
            type: text
            required: true
          - name: boutonAccueil
            label: Bouton vers l'accueil
            type: string
            required: true
          - name: boutonRealisations
            label: Bouton vers les réalisations
            type: string
            required: true

settings:
  content:
    # Les clés que ce fichier ne décrit pas sont conservées telles quelles au
    # lieu d'être effacées à l'enregistrement. Filet de sécurité pour le jour où
    # un champ est ajouté au site mais pas encore ici.
    merge: true
  commit:
    # Les commits portent le nom de la personne qui a fait la modification,
    # plutôt que celui de l'application : sur un site à un seul éditeur, savoir
    # qui a touché à quoi vaut mieux qu'une colonne de « pages-cms[bot] ».
    # Basculer sur `app` si un éditeur invité par e-mail n'arrive pas à publier.
    identity: user
    templates:
      create: 'Ajout de {filename} (depuis le CMS)'
      update: 'Modification de {filename} (depuis le CMS)'
      delete: 'Suppression de {filename} (depuis le CMS)'
      rename: 'Renommage de {oldPath} en {newPath} (depuis le CMS)'

# Un bouton dans la barre latérale du CMS, qui déclenche un workflow.
#
# Enregistrer depuis le CMS publie déjà : chaque commit sur `main` lance
# .github/workflows/deploy.yml. Ce bouton sert aux deux cas où la publication
# n'a pas suivi, et où il n'y a rien à réenregistrer :
#
#   — une vérification a échoué, l'erreur a été corrigée ailleurs (une photo
#     remplacée, une dépendance mise à jour), et le site est resté sur sa
#     version précédente ;
#   — le redimensionnement automatique des photos a repoussé un commit signé
#     par GITHUB_TOKEN, qui ne redéclenche aucun workflow — garde-fou de GitHub
#     contre les boucles, expliqué en bas de photos.yml.
#
# Sans ce bouton, la seule issue est l'onglet Actions de GitHub, que l'éditeur
# n'a aucune raison de connaître.
actions:
  - name: republier
    label: Republier le site
    # Le nom du fichier dans .github/workflows/, pas son intitulé. Pages CMS
    # appelle `createWorkflowDispatch` avec une entrée `payload` contenant un
    # JSON (qui a cliqué, depuis où) : deploy.yml doit la déclarer, sans quoi
    # GitHub refuse le déclenchement pour entrée inconnue.
    workflow: deploy.yml
    # `ref` omis : Pages CMS retombe alors sur la branche affichée.
    confirm:
      title: Republier le site ?
      message: >-
        Le site est reconstruit et remis en ligne à partir du contenu
        actuel. Comptez deux à trois minutes. Rien n'est modifié ni perdu :
        c'est la même publication que celle d'un enregistrement.
      button: Republier
