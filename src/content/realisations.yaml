chantiers:
  - titre: Arêtier sur tasseau
    metier: Charpente
    metierSlug: charpente-ossature-bois
    legende: Charpente en bois clair fraîchement montée sur un toit, vue depuis le
      faîtage ; toits de tuiles, clocher et falaise en arrière-plan.
    alt: Charpente neuve montée sur un bâti de village, arêtier et chevrons posés
      avant couverture.
    image: charpente-aretier.jpg
  - titre: Extension maison en poutres en I
    metier: Ossature bois
    metierSlug: charpente-ossature-bois
    legende: "Intérieur d'une extension en cours de construction, plafond composé de
      poutres en I régulières et murs ossature bois avec panneaux de
      contreventement OSB. Les parois extérieures seront ventilées et recevrons
      un enduit de finition sur Nergalto. "
    alt: Extension maison individuelle en murs ossature bois et charpente en poutres
      en I.
    image: charpente-poutre-en-i.jpg
  - titre: Couverture à tasseaux d'une lucarne
    metier: Couverture
    metierSlug: couverture-zinguerie
    legende: Lucarne reprise en couverture à tasseaux lors d'une réfection de
      toiture à Échirolles.
    alt: Lucarnes 4 pans recevant une couverture sur tasseaux sur les 2 brisis et
      les 2 terrassons.
    image: couverture-a-tasseaux.jpg
  - titre: Création d'une salle de réunion
    metier: Rénovation thermique
    metierSlug: renovation-thermique
    legende: "Doublage intérieur en panneaux de fibre de bois entre montants
      ossature, frein-vapeur continu du sol au plafond : une étanchéité à l'air
      performante nécessite une attention particulière des détails et raccords."
    alt: Création d'une salle de réunion en murs ossature bois en zone non chauffée.
    image: isolation-fibre-de-bois.jpg
  - titre: Pignon claire-voie et bardage épaufré
    metier: Menuiserie
    metierSlug: structure-bois-menuiserie
    legende: "Pignon d'une grange rénovée vu depuis la terrasse couverte : charpente
      apparente lambris épicéa brossé sous le faîtage, lames de bardage épaufré
      et carrelet claire-voie mélèze sous la pergolat."
    alt: Pignon de grange recevant deux types de  bardages mélèze.
    image: bardage-meleze-pignon.jpg
  - titre: Structure de lucarne
    metier: Charpente
    metierSlug: charpente-ossature-bois
    legende: Structure bois avec rupture de pente d'une jacobine sur Echirolles. La
      charpente recevra une couverture en zinc sur tasseaux.
    alt: Structure d'une lucarne jacobine 4 pans.
    image: lucarne-structure.jpg
  - titre: Charpente et chevrons porteurs
    metier: Charpente
    metierSlug: charpente-ossature-bois
    legende: "Charpente refaite à neuf en chevrons porteurs. La contrainte était de
      conserver la hauteur sous plafond et de rester dans la continuité des
      toitures mitoyennes : le chevron porteur permet de ne pas avoir de
      pannes."
    alt: Charpente neuve en bois clair vue de l'intérieur du comble, pannes et
      chevrons assemblés sur ferrures se découpant sur un ciel bleu.
    image: charpente-chevrons-porteurs.jpg
  - titre: Soudure de chéneau
    metier: Zinguerie
    metierSlug: couverture-zinguerie
    legende: Chéneau avec soudure côtelée à l'étain. On oublie pas les joints de
      dilatation si nécessaire et on fait plaisir à nos clients avec de beaux
      récupérateurs d'eau de pluie.
    alt: Fond d'un chéneau de zinc neuf
    image: soudure-cheneau.jpg
  - titre: Pergola
    metier: Structure bois
    metierSlug: structure-bois-menuiserie
    legende: "Pergola adossée en façade sud : de l'ombre portée sur la terrasse et
      sur les baies aux heures les plus chaudes, sans rien changer au bâti.
      L'ouvrage est entièrement réalisé en mélèze du Queyras. Des bouchons de
      bois viennent masquer les fixations."
    alt: Pergola en bois clair adossée à une maison blanche à volets rouges, ses
      chevrons se détachant sur un ciel nuageux ; rosier grimpant au premier
      plan.
    image: pergola-bioclimatique.jpg
  - titre: Balcon suspendu
    metier: Structure bois
    metierSlug: structure-bois-menuiserie
    legende: Réalisation d'un balcon suspendu sur pendillards. La structure et les
      lames de terrasse sont en mélèze. Les sections de bois sont généreuses. La
      lisse haute permet un appui des coudes et des mains confortable.
    alt: Balcon en bois suspendu à la façade d'une maison en bardage bois vertical,
      vu en contre-plongée sur ciel bleu.
    image: balcon-suspendu.jpg
  - titre: Habillage d'acrotères
    metier: Zinguerie
    metierSlug: couverture-zinguerie
    legende: Habillage zinc d'acrotère façonnage maison sur-mesure. La résistance
      aux intempéries de cet ouvrage est importante. Robuste, durable et
      raffiné.
    alt: Pièce de zinc pliée en angle posée sur un établi d'atelier, plis nets et
      surface satinée.
    image: habillage-acroteres.jpg
  - titre: Garde-corps en mélèze
    metier: Structure bois
    metierSlug: structure-bois-menuiserie
    legende: Terrasse de grange équipée d'un garde-corps en mélèze de pays, dans le
      massif de Belledonne.
    alt: Grange de pierre à flanc de pré, dont la terrasse sur pilotis de béton est
      bordée d'un garde-corps neuf en bois clair à barreaux verticaux ; montagne
      boisée à l'arrière-plan.
    image: garde-corps-meleze.jpg
  - titre: Solivage en queue d'aronde
    metier: Charpente
    metierSlug: charpente-ossature-bois
    legende: Plancher neuf assemblé en queue d'aronde dans un comble ancien, sous
      charpente d'origine conservée.
    alt: Comble ancien aux murs de pierre, solives neuves en bois clair posées au
      sol sous une charpente ancienne en bois sombre.
    image: solivage-queue-daronde.jpg
  - titre: Consoles de dépassée
    metier: Charpente
    metierSlug: charpente-ossature-bois
    legende: Consoles de renfort de dépassée, taillées dans du chêne.
    alt: "Vue en contre-plongée sous l'avancée d'un toit : une console de chêne
      clair fraîchement taillée soutient les chevrons anciens en bois sombre,
      contre un mur de pierres apparentes."
    image: consoles-chene.jpg
