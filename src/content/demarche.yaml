piliers:
  - titre: Isolation bio-sourcée et dense
    texte: >-
      Les isolants bio-sourcés offrent une bonne capacité d'isolation thermique
      et phonique tout en ayant un plus faible impacte environnemental. Ils
      permettent aussi une bien meilleure gestion de humidité et grâce à une
      forte densité et/ou épaisseur améliorent le déphasage et donc le confort
      d'été.


      Au-delà des produits classiques, dont la fabrication passe
      systématiquement par une usine, il en est un qui se démarque
      particulièrement.


      La paille favorise l’utilisation de matériaux premiers. Peu coûteux en
      énergie grise, puit de carbone, favorise un air intérieur sain, permet le
      développement économique local et promeut un savoir-faire manuel précieux.


      Tous ces isolants peuvent être mis en oeuvre pour isoler les murs, la
      toiture et les planchers et permet la réalisation de différentes finitions
      sur les parements extérieurs. Nous les employons en caisson dans les murs
      ossature bois, en isolation thermique par l'extérieure (ITE) ainsi qu'en
      toiture.
  - titre: Étanchéité à l'air maîtrisée
    texte: >-
      Une isolation ne vaut que par la qualité de sa mise en œuvre. Nous
      soignons la continuité de l'étanchéité à l'air sans quoi l'isolation perd
      grandement de ses performances.


      L'étanchéité à l'air permet d'éviter une perte de chaleur en hiver et une
      entrée d'air chaud l'été. Eviter des flux d'air inopinés est crucial pour
      ne pas avoir un grand volume d'eau dans l'isolant. La maîtrise des flux
      d'air est essentielle, constitue pour nous un des piliers de l'enveloppe
      du bâtiment et permet un bon fonctionnement de la ventilation.
  - titre: Ventilation double flux
    texte: >-
      La qualité de l'air intérieure et la surchauffe des logements deviennent
      un défi dans le secteur du bâtiment. Allier santé, confort et performance
      énergétique n'est réalisable qu'avec une maîtrise des flux d'air optimum.


      Un bâtiment doit être ventilé. La double flux renouvelle l'air en
      récupérant la chaleur, sans la sensation de courant d'air. La filtration
      installée est performante. Des systèmes permettent le refroidir le
      logement avec l'air extérieure la nuit tout en conservant la fraicheur la
      journée.


      Ce type de ventilation représente un investissement qui impacte
      positivement toutes vos factures.
  - titre: Ventilation des parois de l'enveloppe
    texte: Les parements extérieurs doivent permettre une évacuation des calories
      emmagasinées tout au long de la journée. Il est essentiel de préserver un
      isolant de l'humidité et cela passe par une ventilation passive que se
      soit en toiture ou en murs.
