piliers:
  - titre: Isolation bio-sourcée et dense
    texte: "Des matériaux à faible impact environnemental, posés en forte épaisseur et forte densité. C'est le déphasage qu'ils apportent qui fait le confort d'été, pas seulement la résistance thermique affichée."

  - titre: "Étanchéité à l'air maîtrisée"
    texte: "Une isolation ne vaut que par sa mise en œuvre. Nous soignons la continuité de la barrière à l'air, point par point, pour que la performance calculée soit la performance réelle."

  - titre: Ventilation double flux
    texte: "Un bâtiment étanche doit être ventilé. La double flux renouvelle l'air en récupérant la chaleur, sans la sensation de courant d'air froid."

  - titre: Ventilation des parois de l'enveloppe
    texte: "Les parois doivent pouvoir sécher. Nous ventilons l'enveloppe du bâtiment pour évacuer l'humidité et garantir la durabilité de l'ouvrage dans le temps."
