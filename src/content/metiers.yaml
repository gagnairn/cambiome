metiers:
  - slug: charpente-ossature-bois
    titre: Charpente et murs ossature bois
    chapo: De la reprise une pièce de charpente à la réalisation d'un bâtiment neuf
      complet.
    texte:
      - En étroite collaboration avec un bureau d'études, nous réalisons vos
        projets d'extension de maison et de restauration de charpente.
      - Que ce soit la réalisation d'extension en mur ossature bois, la
        fabrication de lucarnes, le changement de pièces de charpente ou la
        création d'un bâtiment complet, nos équipes sont formées à ce type de
        chantier.
    points:
      - Reprise et modification de charpente existante
      - Extension en mur ossature bois
      - Fabrication de lucarnes
      - Bâtiment neuf complet
      - Travail avec bureau d'études structure
  - slug: renovation-thermique
    titre: Rénovation thermique et pose de menuiseries
    chapo: Forte épaisseur, matériaux bio-sourcés et étanchéité à l'air maîtrisée.
    texte:
      - L'utilisation de matériaux bio-sourcés à faible impact environnemental -
        Une épaisseur importante et une forte densité - L'amélioration des
        performances des fenêtres, la bonne mise en œuvre de l'étanchéité à
        l'air - La mise en place de protections solaires, la ventilation des
        parois extérieures et l'installation d'une ventilation double flux.
      - Autant d'aspects essentiels pour améliorer le confort du bâti existant
        et diminuer nos consommations d'énergie. Nous pouvons aussi vous
        proposer un accompagnement à l'auto-rénovation.
    points:
      - Isolation bio-sourcée dense — confort d’été
      - Étanchéité à l'air du bâtiment
      - Ventilation double flux
      - Ventilation des parois extérieures
      - Protections solaires et menuiseries performantes
      - Accompagnement à l'auto-rénovation
  - slug: couverture-zinguerie
    titre: Couverture et zinguerie
    chapo: La rénovation des toitures de bâti ancien et un traitement soigné des
      finitions.
    texte:
      - Une grande partie de l'activité de CAMBIOME consiste en la rénovation
        des toitures des bâtis anciens.
      - Une attention particulière est donnée à la finition des parements
        extérieurs et aux travaux de zinguerie.
    points:
      - Rénovation de toiture du bâti ancien
      - Parements extérieurs soignés
      - "Zinguerie : abergement façonnage maison sur-mesure"
      - Habillage d’acrotères, noues et rives
  - slug: structure-bois-menuiserie
    titre: Structure bois, terrasses et pergola
    chapo: Le bois local, du mobilier à la terrasse.
    texte:
      - Notre entreprise propose la réalisation de mobilier et de structures
        bois en tout genre.
      - "Nous apprécierons de relever le défi de vos envies : terrasse en bois
        local, escalier, cuisine, persiennes, bardage claire-voie et autres
        claustras."
    points:
      - Terrasse en bois local
      - Pergola
      - Escaliers
      - Cuisine et mobilier sur mesure
      - Persiennes
      - Bardage claire-voie, claustras
  - slug: architecture
    titre: Architecture
    chapo: Conception, calcul et architecture, du relevé de l'existant au détail
      d'exécution.
    texte:
      - "Avant le chantier, il y a le projet. Relevé du bâti existant,
        esquisse, choix des matériaux et dimensionnement de la structure :
        nous concevons l'ouvrage en amont, et nous nous appuyons sur un bureau
        d'études pour les calculs qui l'exigent."
      - Concevoir et construire dans la même entreprise change la nature des
        plans. Les détails d'étanchéité à l'air, les jonctions entre corps de
        métier et les surprises du bâti ancien se règlent sur le papier, avec
        ceux qui monteront l'ouvrage, plutôt que sur le toit le jour venu.
    points:
      - Relevé et diagnostic du bâti existant
      - Esquisse et dessin du projet
      - Calcul et dimensionnement de la structure bois
      - Détails constructifs et d'exécution
      - Coordination avec le bureau d'études structure
