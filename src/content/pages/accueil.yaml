hero:
  titre: Construire et rénover pour un habitat d'avenir durables
  texte: CAMBIOME est une entreprise d'éco-construction spécialisée en charpente,
    ossature bois, couverture, zinguerie et rénovation thermique. L'enveloppe du
    bâtiment est conçu et réalisée en interne avec des matériaux bio-sourcés.
  boutonMetiers: Découvrir nos métiers
  boutonContact: Parler de votre projet
metiers:
  surtitre: Nos réalisations par métiers
  titre: Quatre savoir-faire, un même bâtiment
  texte: "Charpente, couverture, isolation et menuiserie sont traitées ensemble.
    C'est la condition pour que l'enveloppe soit cohérente : pas de rupture
    d'étanchéité à l'air entre deux corps de métier, pas de détail laissé au
    suivant."
demarche:
  surtitre: Notre démarche
  titre: Le confort d'abord, la performance ensuite
  texte: "Une isolation bio-sourcée dense pour le confort d'été, une étanchéité à
    l'air maîtrisée, une ventilation double flux et des parois qui respirent.
    Ces quatre points se tiennent : négliger l'un dégrade les trois autres."
  bouton: En savoir plus sur notre démarche
realisations:
  surtitre: Chantiers
  titre: Quelques réalisations
  bouton: Voir toutes les réalisations
