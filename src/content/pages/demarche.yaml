titreOnglet: Isolation biosourcée, paille et fibre de bois
description: "Isolation biosourcée en paille et fibre de bois, étanchéité à
  l'air, ventilation double flux : l'enveloppe pensée comme un tout, par une
  entreprise Pro-Paille."
surtitre: Éco-construction
titre: Une enveloppe pensée comme un tout
texte: "Un bâtiment confortable n'est pas un empilement de bonnes intentions :
  c'est une enveloppe cohérente. Isolation, étanchéité à l'air et la ventilation
  forment un même système. Voici comment nous l'abordons."
collaboration:
  surtitre: Travailler ensemble
  titre: Bâti ancien, bureau d'études et auto-rénovation
  texte:
    - "Sur les charpentes existantes, nous travaillons en étroite collaboration
      avec un bureau d'études structure : les reprises de charpente, les
      modifications de structures porteuses et les créations d'ouvertures sont
      étudiées avant d'être réalisées."
    - Nous proposons également un accompagnement à l'auto-rénovation. Nous
      prenons en charge les lots techniques — charpente, couverture, étanchéité
      à l'air — et vous gardez la main sur ce que vous pouvez réaliser
      vous-même, avec nos conseils de mise en œuvre.
