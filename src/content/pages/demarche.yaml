titreOnglet: Notre démarche
description: >-
  Isolation bio-sourcée, étanchéité à l'air maîtrisée, ventilation double flux :
  l'enveloppe pensée comme un tout, du bâti ancien à l'auto-rénovation.

surtitre: Éco-construction
titre: Une enveloppe pensée comme un tout
texte: >-
  Un bâtiment confortable n'est pas un empilement de bonnes intentions : c'est
  une enveloppe cohérente. Isolation, étanchéité à l'air, ventilation intérieure
  et ventilation des parois forment un même système. Voici comment nous
  l'abordons.

collaboration:
  surtitre: Travailler ensemble
  titre: Bâti ancien, bureau d'études et auto-rénovation
  texte:
    - >-
      Sur les charpentes existantes, nous travaillons en étroite collaboration
      avec un bureau d'études structure : les reprises de pièces, les
      modifications de pans et les créations d'ouvertures sont calculées avant
      d'être taillées.
    - >-
      Nous proposons également un accompagnement à l'auto-rénovation. Nous
      prenons en charge les lots techniques — charpente, couverture, étanchéité à
      l'air — et vous gardez la main sur ce que vous pouvez réaliser vous-même,
      avec nos conseils de mise en œuvre.
