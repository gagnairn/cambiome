name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aucun droit par défaut : chaque job demande ce dont il a besoin, et rien de
# plus. Le job qui construit n'a ainsi jamais de jeton capable de déployer.
permissions: {}

# Un seul déploiement à la fois ; on laisse finir celui en cours plutôt que de
# l'interrompre au milieu d'une publication.
concurrency:
  group: pages
  cancel-in-progress: false

# Les actions sont épinglées sur un SHA de commit et non sur un tag : un tag
# comme `v4` est mutable, celui qui le contrôle peut le refaire pointer sur du
# code arbitraire qui s'exécuterait ici avec nos permissions. Le SHA, lui, est
# immuable. Le commentaire donne la version lisible, et Dependabot met à jour
# les deux (voir .github/dependabot.yml).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Le jeton n'a pas à rester dans .git/config du runner pendant que
          # `npm ci` exécute les scripts d'installation des dépendances.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `build` ne remonte pas les erreurs de types ni de props Astro : sans
      # cette étape, un lien ou une prop cassée se déploie sans rien signaler.
      - run: npm run check

      - run: npm run build

      # `check` ne regarde pas les URL. Cette étape relit le site construit et
      # refuse de déployer un lien interne mort — le favicon servi en 404
      # pendant deux commits serait tombé ici.
      - run: npm run verifier

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # La source Pages doit être réglée sur « GitHub Actions » dans
      # Settings → Pages. Tant qu'elle pointe sur une branche, GitHub lance en
      # parallèle son constructeur Jekyll historique, qui échoue à chaque push
      # sur un site Astro. Ce réglage ne peut pas être automatisé ici :
      # l'endpoint REST correspondant exige des droits d'administration que
      # `GITHUB_TOKEN` n'a pas, même avec `pages: write` (403).
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Le déploiement peut réussir sur un site cassé : artefact vide, page 404 non
  # servie, CSP absente. Ce job interroge l'URL réellement publiée.
  fumee:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - env:
          URL_SITE: ${{ needs.deploy.outputs.url }}
        run: ./scripts/fumee.sh "$URL_SITE"
