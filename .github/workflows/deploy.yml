name: Déploiement OVH

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # Déclaré pour le bouton « Republier le site » du CMS (voir le bloc
      # `actions` en bas de .pages.yml) : Pages CMS déclenche toujours le
      # workflow avec cette entrée, et GitHub rejette un déclenchement dont une
      # entrée n'est pas déclarée. Le contenu n'est lu par personne ici — la
      # publication ne dépend pas de qui la demande — mais il reste consultable
      # dans le récapitulatif du run, ce qui suffit à savoir d'où vient une
      # republication.
      #
      # `required: false` : sans cela, le déclenchement manuel depuis l'onglet
      # Actions réclamerait de coller un JSON à la main.
      payload:
        description: Charge utile JSON de Pages CMS — laisser vide en manuel
        required: false

# Aucun droit par défaut : chaque job demande ce dont il a besoin, et rien de
# plus. Le job qui construit n'a ainsi jamais de jeton capable de déployer.
permissions: {}

# Un seul déploiement à la fois ; on laisse finir celui en cours plutôt que de
# l'interrompre au milieu d'une publication.
concurrency:
  group: ovh
  cancel-in-progress: false

# Les actions sont épinglées sur un SHA de commit et non sur un tag : un tag
# comme `v7` est mutable, celui qui le contrôle peut le refaire pointer sur du
# code arbitraire qui s'exécuterait ici avec nos permissions. Le SHA, lui, est
# immuable. Le commentaire donne la version lisible, et Dependabot met à jour
# les deux (voir .github/dependabot.yml).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le jeton n'a pas à traîner sur le runner pendant que `npm ci`
          # exécute les scripts d'installation des dépendances. (Depuis la v6,
          # checkout ne l'écrit plus dans .git/config mais dans un fichier à
          # part ; le raisonnement ne change pas, le réglage non plus.)
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # LTS active. La 26 est sortie en avril 2026 mais ne passe LTS qu'en
          # octobre : c'est la version du poste de développement, pas celle
          # d'une chaîne de publication. À faire passer à 26 à ce moment-là.
          node-version: 24
          # Explicite, bien que la v5 sache déclencher le cache toute seule :
          # elle le fait sur le champ `packageManager` de package.json, que ce
          # dépôt n'a pas.
          cache: npm

      - run: npm ci

      # Les icônes, la marque de l'en-tête et l'image de partage sont des
      # dérivés des logos sources — et ces logos sont téléversables depuis le
      # CMS. Sans cette étape, remplacer le logo publierait un site à la
      # nouvelle marque mais au favicon de l'ancienne, jusqu'à ce qu'un
      # développeur relance la commande à la main. On régénère donc à chaque
      # publication : le site en ligne est toujours cohérent avec ses sources.
      #
      # La sortie est déterministe — mêmes sources, mêmes octets — donc cette
      # étape ne produit aucune différence tant que les logos ne bougent pas.
      # Les fichiers restent versionnés pour que `npm run dev` fonctionne sans
      # avoir rien à lancer, et `images.yml` les recommite quand ils changent.
      #
      # Elle passe AVANT `check` : c'est `derives/marque-noire.png` qu'importe
      # l'en-tête, et il doit être à jour avant qu'Astro ne le lise.
      - run: npm run images

      # `build` ne remonte pas les erreurs de types ni de props Astro : sans
      # cette étape, un lien ou une prop cassée se déploie sans rien signaler.
      - run: npm run check

      - run: npm run build

      # `check` ne regarde pas les URL. Cette étape relit le site construit et
      # refuse de déployer un lien interne mort — le favicon servi en 404
      # pendant deux commits serait tombé ici.
      - run: npm run verifier

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          retention-days: 7
          # Depuis la v4, l'action exclut les fichiers cachés de l'archive.
          # `dist` en contient un, venu de `public/` : .htaccess, qui porte les
          # en-têtes de sécurité et la page 404 côté Apache. Sans cette ligne
          # il disparaîtrait du dépôt sans que rien ne le signale, et le site
          # servirait la page d'erreur par défaut d'Apache, sans en-têtes.
          # (.git et .github restent exclus d'office.)
          include-hidden-files: true

  # Dépôt chez OVH, hébergement mutualisé Apache, par SFTP.
  #
  # Aucune permission GitHub : ce job ne parle plus qu'à OVH. C'est aussi le
  # seul à voir les secrets SFTP — le job `build` ci-dessus exécute `npm ci`,
  # donc les scripts d'installation de toutes les dépendances, et n'a rien à
  # faire avec un mot de passe d'hébergeur.
  #
  # Pas d'action tierce pour le transfert : le dépôt épingle ses actions au SHA
  # précisément parce qu'un tag est mutable, et le raisonnement vaut d'autant
  # plus sur le chemin d'un mot de passe. `lftp` est dans les dépôts Ubuntu et
  # se contente du sous-système SFTP, là où `rsync` exigerait un shell distant
  # que le mutualisé OVH n'ouvre pas.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      # Garde-fou : un artefact vide passerait le miroir sans erreur et
      # viderait le site. `index.html` et `.htaccess` sont les deux fichiers
      # dont l'absence ne se verrait pas autrement — le second est caché, et
      # c'est lui qui porte les en-têtes et la page 404.
      - name: Vérifier l'artefact avant de toucher au serveur
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html manquant"; exit 1; }
          test -f dist/.htaccess  || { echo "::error::dist/.htaccess manquant — en-têtes et page 404 perdus"; exit 1; }
          echo "$(find dist -type f | wc -l) fichiers à déposer"

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lftp

      # La clé d'hôte est épinglée plutôt que découverte : sans elle il
      # faudrait `StrictHostKeyChecking=no`, qui accepterait n'importe quel
      # serveur répondant à cette adresse. Relevée une fois par
      # `ssh-keyscan <serveur>` et rangée en secret.
      - name: Épingler la clé d'hôte
        env:
          CLE_HOTE: ${{ secrets.OVH_SFTP_CLE_HOTE }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE_HOTE" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # `--delete` retire du serveur ce qui n'est plus dans `dist/`. C'est
      # nécessaire : les fichiers de `_astro/` sont nommés par empreinte et
      # s'accumuleraient à chaque publication. C'est aussi l'étape qui exige
      # que `OVH_SFTP_REPERTOIRE` désigne bien la racine du site et rien
      # au-dessus.
      #
      # Pas de `--only-newer` : un build CI horodate tous les fichiers à
      # l'instant présent, donc tout y est « plus récent » et le drapeau
      # promettrait une incrémentalité qu'il ne rend pas. Chaque publication
      # redépose donc les ~10 Mo du site, une minute ou deux. Les variantes
      # qui compareraient la taille seule (`--ignore-time`) iraient plus vite
      # mais laisseraient passer un HTML modifié à taille égale : trop cher
      # payé pour le gain.
      #
      # `--exclude-glob _headers` : format Netlify / Cloudflare, sans effet
      # chez Apache. Le déposer le rendrait public pour rien.
      #
      # Le mot de passe n'est écrit nulle part : `--env-password` le fait lire
      # par lftp dans `LFTP_PASSWORD`. Le passer en argument l'exposerait dans
      # la table des processus du runner, et l'écrire dans le script le ferait
      # apparaître tel quel si la commande était tracée.
      #
      # Le script arrive par l'entrée standard et non par `lftp -c "…"`, pour
      # la même raison. Les variables sont donc développées par le shell, pas
      # par lftp, qui ne le fait pas.
      - name: Déposer le site
        env:
          SERVEUR: ${{ secrets.OVH_SFTP_SERVEUR }}
          LOGIN: ${{ secrets.OVH_SFTP_LOGIN }}
          LFTP_PASSWORD: ${{ secrets.OVH_SFTP_MOTDEPASSE }}
          REPERTOIRE: ${{ secrets.OVH_SFTP_REPERTOIRE }}
        run: |
          lftp <<LFTP
          set cmd:fail-exit true
          set net:max-retries 3
          set net:timeout 20
          set sftp:auto-confirm false
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          open --env-password -u "$LOGIN" sftp://$SERVEUR
          mirror --reverse --delete --parallel=4 --verbose=1 --exclude-glob _headers dist/ "$REPERTOIRE"
          bye
          LFTP

  # Le déploiement peut réussir sur un site cassé : transfert partiel, page 404
  # non servie, CSP absente. Ce job interroge l'adresse réellement publiée.
  #
  # L'URL est écrite ici : elle venait de la sortie de `deploy-pages`, qui
  # n'existe plus. C'est le seul endroit du dépôt où le domaine est en dur hors
  # d'`astro.config.mjs` — inévitable, un hébergeur SFTP ne renvoyant pas
  # l'adresse à laquelle il sert.
  fumee:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - env:
          URL_SITE: https://www.cambiome.fr
        run: ./scripts/fumee.sh "$URL_SITE"
