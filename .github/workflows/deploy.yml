name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Aucun droit par défaut : chaque job demande ce dont il a besoin, et rien de
# plus. Le job qui construit n'a ainsi jamais de jeton capable de déployer.
permissions: {}

# Un seul déploiement à la fois ; on laisse finir celui en cours plutôt que de
# l'interrompre au milieu d'une publication.
concurrency:
  group: pages
  cancel-in-progress: false

# Les actions sont épinglées sur un SHA de commit et non sur un tag : un tag
# comme `v4` est mutable, celui qui le contrôle peut le refaire pointer sur du
# code arbitraire qui s'exécuterait ici avec nos permissions. Le SHA, lui, est
# immuable. Le commentaire donne la version lisible, et Dependabot met à jour
# les deux (voir .github/dependabot.yml).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Le jeton n'a pas à rester dans .git/config du runner pendant que
          # `npm ci` exécute les scripts d'installation des dépendances.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `build` ne remonte pas les erreurs de types ni de props Astro : sans
      # cette étape, un lien ou une prop cassée se déploie sans rien signaler.
      - run: npm run check

      - run: npm run build

      # `check` ne regarde pas les URL. Cette étape relit le site construit et
      # refuse de déployer un lien interne mort — le favicon servi en 404
      # pendant deux commits serait tombé ici.
      - run: npm run verifier

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub lance son constructeur Jekyll historique en parallèle du nôtre
      # tant que la source Pages est réglée sur une branche — un échec rouge à
      # chaque push, sans rapport avec le déploiement réel. Ce PUT bascule la
      # source sur « GitHub Actions ». Il est idempotent, donc inoffensif une
      # fois le réglage en place, et il le remet d'aplomb s'il dérive.
      #
      # Volontairement non bloquant : c'est un réglage de confort, pas la
      # publication. Un incident d'API ne doit pas empêcher le site de sortir.
      - name: Régler la source Pages sur GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f build_type=workflow \
            || echo "::warning::Bascule de la source Pages impossible ; à faire dans Settings → Pages."

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # Le déploiement peut réussir sur un site cassé : artefact vide, page 404 non
  # servie, CSP absente. Ce job interroge l'URL réellement publiée.
  fumee:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - env:
          URL_SITE: ${{ needs.deploy.outputs.url }}
        run: ./scripts/fumee.sh "$URL_SITE"
