name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions requises par le déploiement Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on laisse finir celui en cours
concurrency:
  group: pages
  cancel-in-progress: false

# Les actions sont épinglées sur un SHA de commit et non sur un tag : un tag
# comme `v4` est mutable, celui qui le contrôle peut le refaire pointer sur du
# code arbitraire qui s'exécuterait ici avec nos permissions. Le SHA, lui, est
# immuable. Le commentaire donne la version lisible ; pour mettre à jour,
# reprendre le SHA depuis la page des releases de l'action.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `build` ne remonte pas les erreurs de types ni de props Astro : sans
      # cette étape, un lien ou une prop cassée se déploie sans rien signaler.
      - run: npm run check

      - run: npm run build

      # `enablement: true` active GitHub Pages au premier passage, sans avoir
      # à le faire à la main dans Settings → Pages.
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
