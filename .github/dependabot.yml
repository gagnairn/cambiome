# Mises à jour automatiques des dépendances.
#
# Contrepartie indispensable de l'épinglage sur SHA dans les workflows : figer
# une action sur un commit immuable met à l'abri d'un tag repointé, mais fige
# aussi ses correctifs de sécurité. Dependabot lève cette contrepartie.
#
# La présence de ce fichier suffit à activer les mises à jour de version. Les
# *alertes* de sécurité, elles, se règlent dans Settings → Advanced Security.
version: 2

updates:
  # Dependabot connaît la convention `uses: action@<sha> # <version>` : il met
  # à jour le SHA *et* le commentaire de version, l'épinglage reste lisible.
  # Mensuel et non hebdomadaire : le dépôt n'a qu'une branche vivante, `main`,
  # et chaque mise à jour en fait apparaître une seconde le temps de la
  # fusionner. Un rendez-vous par mois plutôt que quatre suffit à ce que
  # l'épinglage sur SHA ne prenne pas de retard, sans laisser traîner une
  # branche ouverte trois semaines sur quatre.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'CI'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Une seule PR pour l'ensemble des mises à jour mineures et correctives :
    # sur un site vitrine, une PR par paquet et par mois n'apporte rien qu'un
    # bruit qu'on finit par ne plus ouvrir. Les majeures restent séparées,
    # elles méritent d'être regardées une par une.
    groups:
      mineures-et-correctifs:
        update-types:
          - minor
          - patch
    # TypeScript 7 est le compilateur réécrit en Go. Il n'expose pas l'API
    # programmatique dont `astro check` se sert, et `astro check` refuse de
    # démarrer avec — testé, pas supposé. `@astrojs/check` déclare d'ailleurs
    # `typescript: ^5 || ^6`. Sans cette exception, Dependabot rouvrirait tous
    # les mois une PR qui ne peut que rougir. À retirer quand la discussion
    # withastro/roadmap#1321 aboutit.
    ignore:
      - dependency-name: typescript
        versions: ['7.x']
    commit-message:
      prefix: 'Dépendances'
